name: Rust

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions-rs/toolchain@v1.0.7
      with:
        toolchain: stable
        profile: minimal
        components: llvm-tools-preview
        override: true
        
    - uses: Swatinem/rust-cache@v2

    # - name: install protoc
    #   run: |
    #     $protoc_url = "https://github.com/protocolbuffers/protobuf/releases/download/v3.20.2/protoc-3.20.2-linux-x86_64.zip"
    #     Write-Host "Downloading protoc from '$protoc_url'"
    #     Invoke-WebRequest -OutFile protoc.zip -Uri $protoc_url
    #     Expand-Archive protoc.zip -DestinationPath ../tools
    #     Add-Content -Path $env:GITHUB_PATH -Value "$((Get-Item ./).Parent.FullName)/tools/bin"
    #   shell: pwsh
        
    - name: Run tests
      uses: actions-rs/cargo@v1.0.3
      with:
        command: test
        args: --all-features --no-fail-fast
      env:
        RUSTFLAGS: "-C instrument_coverage"
        LLVM_PROFILE_FILE: default.profraw
      
    - name: install rustfilt
      uses: actions-rs/cargo@v1.0.3
      with:
        command: install
        args: rustfilt
        
    - name: prepare coverage output
      shell: pwsh
      run: |
        Write-Host "Merging raw profile output files"
        &"$(rustc --print target-libdir)/../bin/llvm-profdata" merge -sparse default.profraw -o default.profdata

        # The crate builds a library, a binary and an integration test, each of
        # which produces its own test executable. All of them have to be passed
        # to llvm-cov or the report only reflects whichever one happens to be
        # picked, badly under-reporting coverage.
        $binaries = Get-ChildItem -Path ./target/debug/deps -File `
        | Where-Object { $_.Name -match '^(on_call|examples)-[0-9a-f]+(\.exe)?$' } `
        | Where-Object { $_.Name.EndsWith(".exe") -or (-not $_.Name.Contains(".")) }

        if (-not $binaries) {
          throw "No test binaries found to measure coverage against"
        }

        Write-Host "Measuring coverage across:"
        $binaries | ForEach-Object { Write-Host "  $($_.Name)" }

        $objects = @($binaries[0].FullName)
        $binaries | Select-Object -Skip 1 | ForEach-Object { $objects += @("-object", $_.FullName) }

        Write-Host "Exporting LCOV coverage report"
        &"$(rustc --print target-libdir)/../bin/llvm-cov" export -instr-profile default.profdata @objects `
            -Xdemangler=rustfilt `
            -ignore-filename-regex='.cargo|rustc' `
            -compilation-dir=src `
            -format=lcov > lcov.info
    
    - name: Upload code coverage
      uses: codecov/codecov-action@v7
      with:
        file: ./lcov.info